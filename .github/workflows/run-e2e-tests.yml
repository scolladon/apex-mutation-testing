---
name: E2E Tests a published version
on:
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      expected-version:
        type: string
        required: true
      run-org-e2e:
        description: >-
          Whether the org-bound e2e can run. Only the caller knows: a fork pull request
          never receives repository secrets, so it must be false there and the job skips
          rather than failing at authentication. Everywhere else it is true, and a missing
          credential then fails loudly at login instead of silently skipping the only job
          that asserts real behaviour.
        type: boolean
        required: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      # Consumer-side on purpose. The `channel` input carries no `default:`, because a
      # default silently substitutes when a caller passes an empty string and turns the
      # whole matrix green against the wrong build. No producer-side check can close that.
      - name: Assert a channel and an expected version were provided
        env:
          CHANNEL: ${{ inputs.channel }}
          EXPECTED: ${{ inputs.expected-version }}
        run: |
          if [ -z "${CHANNEL// }" ]; then
            echo "::error::channel input is empty - refusing to run e2e against an unknown build"
            exit 1
          fi
          if [ -z "${EXPECTED// }" ]; then
            echo "::error::expected-version input is empty - refusing to run e2e against an unidentified build"
            exit 1
          fi

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Set environment variables
        run: |
          echo "SF_DISABLE_AUTOUPDATE=true" >> "$GITHUB_ENV"
          echo "SF_DISABLE_TELEMETRY=true" >> "$GITHUB_ENV"

      - name: Install cli
        run: npm install -g @salesforce/cli

      - name: Install new plugin version
        env:
          CHANNEL: ${{ inputs.channel }}
        run: echo y | sf plugins install "$CHANNEL"

      - name: Assert the installed plugin is the intended build
        env:
          EXPECTED_VERSION: ${{ inputs.expected-version }}
        run: |
          EXPECTED="${EXPECTED_VERSION#v}"
          ACTUAL=$(sf plugins inspect apex-mutation-testing --json | jq -r '.[0].version')
          echo "installed=$ACTUAL expected=$EXPECTED"
          [ "$ACTUAL" = "$EXPECTED" ]

      - name: Test new plugin version installation
        run: sf apex mutation test run --help

  # Runs independently of smoke: it installs the plugin and asserts its identity before
  # it ever authenticates, so a build that cannot install never reaches the org. Gating
  # it on the matrix bought no protection and cost the org leg the matrix's wall clock.
  org-e2e:
    if: inputs.run-org-e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: latest

      - name: Set environment variables
        run: |
          echo "SF_DISABLE_AUTOUPDATE=true" >> "$GITHUB_ENV"
          echo "SF_DISABLE_TELEMETRY=true" >> "$GITHUB_ENV"

      - name: Install cli
        run: npm install -g @salesforce/cli

      - name: Install new plugin version
        env:
          CHANNEL: ${{ inputs.channel }}
        run: echo y | sf plugins install "$CHANNEL"

      - name: Assert the installed plugin is the intended build
        env:
          EXPECTED_VERSION: ${{ inputs.expected-version }}
        run: |
          EXPECTED="${EXPECTED_VERSION#v}"
          ACTUAL=$(sf plugins inspect apex-mutation-testing --json | jq -r '.[0].version')
          echo "installed=$ACTUAL expected=$EXPECTED"
          [ "$ACTUAL" = "$EXPECTED" ]

      - name: Authenticate to E2E test org
        id: auth
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: echo "$SFDX_AUTH_URL" | sf org login sfdx-url --alias e2e-test-org --set-default --sfdx-url-stdin

      - name: Setup - Deploy test classes
        run: npm run test:e2e:setup

      - name: Execute - Run mutation testing
        run: npm run test:e2e:run

      - name: Validate - Check snapshot
        run: npm run test:e2e:validate

      # Only meaningful once the org is authenticated. Without the guard, a build that
      # fails the identity assertion would deploy against an org it never logged into,
      # burying the real failure under a second misleading one.
      - name: Teardown - Reset test classes
        if: always() && steps.auth.conclusion == 'success'
        run: npm run test:e2e:teardown

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-test-report
          path: test/e2e
