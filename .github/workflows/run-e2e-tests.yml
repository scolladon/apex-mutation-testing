---
name: E2E Tests a published version
on:
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      expected-version:
        type: string
        required: true
      require-org:
        description: >-
          Refuse to report success unless the org credential is present. Callers on a
          path that must exercise a real org (the release path) set this to true, so a
          revoked or renamed credential fails loudly instead of silently skipping the
          only job that asserts real behaviour.
        type: boolean
        default: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      has-org: ${{ steps.detect.outputs.has-org }}
    steps:
      - name: Assert a channel was provided
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ -z "${CHANNEL// }" ]; then
            echo "::error::channel input is empty - refusing to run e2e against an unknown build"
            exit 1
          fi

      - name: Assert an expected version was provided
        env:
          EXPECTED: ${{ inputs.expected-version }}
        run: |
          if [ -z "${EXPECTED// }" ]; then
            echo "::error::expected-version input is empty - refusing to run e2e against an unidentified build"
            exit 1
          fi

      - name: Detect org credentials
        id: detect
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
          REQUIRE_ORG: ${{ inputs.require-org }}
        run: |
          if [ -n "$SFDX_AUTH_URL" ]; then
            echo "has-org=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A fork pull request legitimately has no credential - it skips the org leg
          # and stays green. Any path that declares it requires one must go red rather
          # than report success on the strength of the smoke matrix alone.
          if [ "$REQUIRE_ORG" = "true" ]; then
            echo "::error::SFDX_AUTH_URL is missing but this path requires the org e2e - refusing to report success without it"
            exit 1
          fi

          echo "has-org=false" >> "$GITHUB_OUTPUT"
          echo "::notice::No org credential available - the org e2e will be skipped and only the smoke matrix will run"

  smoke:
    needs: [preflight]
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Set environment variables
        run: |
          echo "SF_DISABLE_AUTOUPDATE=true" >> "$GITHUB_ENV"
          echo "SF_DISABLE_TELEMETRY=true" >> "$GITHUB_ENV"

      - name: Install cli
        run: npm install -g @salesforce/cli

      - name: Install new plugin version
        env:
          CHANNEL: ${{ inputs.channel }}
        run: echo y | sf plugins install "$CHANNEL"

      - name: Assert the installed plugin is the intended build
        env:
          EXPECTED_VERSION: ${{ inputs.expected-version }}
        run: |
          EXPECTED="${EXPECTED_VERSION#v}"
          ACTUAL=$(sf plugins inspect apex-mutation-testing --json | jq -r '.[0].version')
          echo "installed=$ACTUAL expected=$EXPECTED"
          [ "$ACTUAL" = "$EXPECTED" ]

      - name: Test new plugin version installation
        run: sf apex mutation test run --help

  # Deliberately gated on preflight alone, not on smoke. This job installs the plugin
  # and asserts its identity before it ever authenticates, so a build that cannot
  # install never reaches the org - the extra gate bought no protection and cost the
  # org leg the full wall clock of the matrix, including on the release path where an
  # unrelated node-leg flake would have suppressed the only real-behaviour assertion.
  org-e2e:
    needs: [preflight]
    if: needs.preflight.outputs.has-org == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: latest

      - name: Set environment variables
        run: |
          echo "SF_DISABLE_AUTOUPDATE=true" >> "$GITHUB_ENV"
          echo "SF_DISABLE_TELEMETRY=true" >> "$GITHUB_ENV"

      - name: Install cli
        run: npm install -g @salesforce/cli

      - name: Install new plugin version
        env:
          CHANNEL: ${{ inputs.channel }}
        run: echo y | sf plugins install "$CHANNEL"

      - name: Assert the installed plugin is the intended build
        env:
          EXPECTED_VERSION: ${{ inputs.expected-version }}
        run: |
          EXPECTED="${EXPECTED_VERSION#v}"
          ACTUAL=$(sf plugins inspect apex-mutation-testing --json | jq -r '.[0].version')
          echo "installed=$ACTUAL expected=$EXPECTED"
          [ "$ACTUAL" = "$EXPECTED" ]

      - name: Authenticate to E2E test org
        id: auth
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: echo "$SFDX_AUTH_URL" | sf org login sfdx-url --alias e2e-test-org --set-default --sfdx-url-stdin

      - name: Setup - Deploy test classes
        run: npm run test:e2e:setup

      - name: Execute - Run mutation testing
        run: npm run test:e2e:run

      - name: Validate - Check snapshot
        run: npm run test:e2e:validate

      # Only meaningful once the org is authenticated. Without the guard, a build that
      # fails the identity assertion would deploy against an org it never logged into,
      # burying the real failure under a second misleading one.
      - name: Teardown - Reset test classes
        if: always() && steps.auth.conclusion == 'success'
        run: npm run test:e2e:teardown

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-test-report
          path: test/e2e
