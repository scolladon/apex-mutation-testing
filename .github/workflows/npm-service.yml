---
name: NPM Service

on:
  release:
    types: [published]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.publish.outputs.channel }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: latest
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - uses: ./.github/actions/install

      - name: Publish
        id: publish
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          npm publish --provenance --access public --tag "latest-rc"
          echo "channel=apex-mutation-testing@$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.publish.outputs.urls }}
      preview-version: ${{ steps.record.outputs.preview-version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      - uses: ./.github/actions/install

      - run: npm run build

      - name: Publish preview
        id: publish
        run: npm run preview:publish

      # The artifact deliberately carries ONLY the pull request number. The comment
      # workflow reconstructs the preview URL from trusted context instead of trusting
      # this job's output, because on a fork pull request this job runs from the fork's
      # own workflow file and everything it writes is contributor-controlled.
      - name: Record the preview for the comment workflow
        id: record
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          URLS: ${{ steps.publish.outputs.urls }}
        run: |
          if [ -z "${URLS// }" ]; then
            echo "::error::pkg-pr-new produced no preview URL"
            exit 1
          fi
          case "$URLS" in
            *[[:space:]]*)
              echo "::error::expected exactly one preview URL, got: $URLS"
              exit 1
              ;;
          esac
          # The comment workflow rebuilds this URL from trusted context rather than
          # trusting the artifact, so the published URL must actually carry the
          # abbreviated sha it will rebuild. pkg-pr-new downgrades to the full 40-char
          # form if it cannot resolve the package on the registry, which would leave the
          # comment pointing at a 404 with nothing else to catch it. Fail here instead.
          case "$URLS" in
            *"@${HEAD_SHA:0:7}") ;;
            *)
              echo "::error::published preview URL $URLS does not end with @${HEAD_SHA:0:7} - the comment workflow would rebuild a URL that does not resolve"
              exit 1
              ;;
          esac

          # --previewVersion always builds the version from the 7-char abbreviation,
          # regardless of whether the published URL is compact or long form.
          echo "preview-version=0.0.0-preview-${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
          mkdir -p preview
          printf '%s\n' "$PR_NUMBER" > preview/pr-number

      - uses: actions/upload-artifact@v7
        with:
          name: preview
          path: preview/

  e2e-tests:
    needs: [publish, preview]
    if: "!cancelled() && (needs.publish.result == 'success' || needs.preview.result == 'success')"
    uses: ./.github/workflows/run-e2e-tests.yml
    with:
      channel: ${{ needs.publish.outputs.channel || needs.preview.outputs.channel }}
      expected-version: ${{ github.event.release.tag_name || needs.preview.outputs.preview-version }}
      require-org: ${{ github.event_name == 'release' }}
    secrets: inherit
