---
name: NPM Service

on:
  release:
    types: [published]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.publish.outputs.channel }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: latest
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - uses: ./.github/actions/install

      - name: Publish
        id: publish
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          npm publish --provenance --access public --tag "latest-rc"
          echo "channel=apex-mutation-testing@$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.publish.outputs.urls }}
      sha: ${{ steps.publish.outputs.sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      - uses: ./.github/actions/install

      - run: npm run build

      - name: Publish preview
        id: publish
        run: npm exec -- pkg-pr-new publish --previewVersion --comment=off --json pkg-pr-new.json

      - name: Record the preview for the comment workflow
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          URLS: ${{ steps.publish.outputs.urls }}
        run: |
          if [ -z "${URLS// }" ]; then
            echo "::error::pkg-pr-new produced no preview URL"
            exit 1
          fi
          case "$URLS" in
            *[[:space:]]*)
              echo "::error::expected exactly one preview URL, got: $URLS"
              exit 1
              ;;
          esac
          mkdir -p preview
          printf '%s\n' "$PR_NUMBER" > preview/pr-number
          printf '%s\n' "$URLS" > preview/url

      - uses: actions/upload-artifact@v7
        with:
          name: preview
          path: preview/

  e2e-tests:
    needs: [publish, preview]
    if: "!cancelled() && (needs.publish.result == 'success' || needs.preview.result == 'success')"
    uses: ./.github/workflows/run-e2e-tests.yml
    with:
      channel: ${{ needs.publish.outputs.channel || needs.preview.outputs.channel }}
      expected-version: ${{ github.event.release.tag_name || format('0.0.0-preview-{0}', needs.preview.outputs.sha) }}
    secrets: inherit
