# OSV-Scanner suppressions
# See https://google.github.io/osv-scanner/configuration/
#
# No suppressions are currently in force. The file is kept because the
# MegaLinter job invokes osv-scanner with `--config <this file>`.
#
# A suppression must state why the advisory is not reachable for this package,
# and must be removed once it stops applying: osv-scanner reports an ignore
# that no longer matches anything as an unused ignore, so a stale entry becomes
# noise in every future run.
